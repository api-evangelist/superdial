    operationId: listSchemas
- target: $.paths['/v1/schemas/{schemaId}/required-inputs'].get
  update:
    operationId: getSchemaRequiredInputs
- target: $.paths['/v1/schemas/{schemaId}/required-payer-inputs'].post
  update:
    operationId: resolvePayerRequiredInputs
    x-safe: true
    x-note: POST verb but read-only — resolves payer required inputs without changing state.
- target: $.paths['/v1/requests'].post
  description: >-
    Mark the single write operation with its idempotency mechanism, its real-world consequence, and
    the absence of any reversal path.
  update:
    operationId: createRequest
    x-idempotency:
      supported: true
      key_field: internalId
      key_location: body
      scope: per-request
      server_managed_default: true
      silent_on_reuse: true
    x-consequence:
      class: external-side-effect
      description: >-
        Places a real outbound telephone call to an insurance payer, disclosing member and provider
        identifiers. Billable per call.
      reversible: false
      reversal_operation: null
      rehearsal: sandbox credentials (no real call dialed)
