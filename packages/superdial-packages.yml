findings:
- >-
  SuperDial publishes NO client libraries in any package registry, and has no GitHub organization.
  Every code sample in the documentation is raw HTTP — Python `requests` and Node `fetch`/`crypto`
  written inline, not an SDK call.
- >-
  This is a deliberate-looking posture rather than an oversight: the API is small (7 operations,
  one write), the docs are thorough, and the samples are complete enough to integrate from
  directly. But it means every consumer hand-rolls token refresh, webhook signature verification,
  batch splitting and the read-after-write retry — all of which are documented hazards an SDK
  would otherwise absorb.
- >-
  Absence of an SDK also removes the strongest available decay signal: there is no published
  release date anywhere to compare against the API's own version.
