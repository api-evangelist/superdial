apis:
- name: SuperDial API
  description: Asynchronous REST API for submitting structured data extraction requests against insurance
    payers and retrieving the results. Submit a request (single or batch) against an account-provisioned
    schema, discover the inputs a schema requires, resolve payer names to dialing numbers, and read results
    by ID or by batch. Terminal results are delivered by an HMAC-SHA256-signed webhook. Auth is a short-lived
    bearer token exchanged for an API key/secret pair.
  humanURL: https://docs.superdial.com/introduction
