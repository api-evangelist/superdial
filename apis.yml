aid: superdial
name: SuperDial
description: 'SuperDial builds voice AI agents that automate high-friction administrative phone calls
  in healthcare revenue cycle management. Its agents place outbound calls from providers, billing teams
  and RCM companies to insurance payers — navigating IVR phone trees, holding, and conducting live conversations
  with payer representatives — and return structured, auditable results. Common workflows include benefits
  verification, prior authorization, claim status, provider data validation, and credentialing and enrollment
  outreach. The SuperDial API exposes this as an asynchronous job API: a client submits a "request" against
  an account-provisioned schema, SuperDial fulfills it across digital and phone modalities, and delivers
  the structured result by signed webhook or polling. Founded in 2021 in San Francisco as SuperBill by
  Stanford classmates Sam Schwager and Harrison Caruthers, the company raised a $15M Series A led by SignalFire
  in 2025.'
