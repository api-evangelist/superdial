- {code: PRIOR_AUTH_NOT_FOUND, meaning: Prior authorization could not be located.}
- {code: APPEAL_NOT_FOUND, meaning: Appeal could not be located.}
- {code: OTHER, meaning: NOT_FOUND failure where no specific entity / *_MISSING / *_INCORRECT code fits.}
