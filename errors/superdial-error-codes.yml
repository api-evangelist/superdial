description: >-
  SuperDial's BUSINESS-outcome error registry, carried on the request object itself, not on the
  HTTP response. A request that failed to obtain data from the payer still returns HTTP 200 on
  GET /v1/requests/{requestId}; the failure is described by state FAILURE plus a structured
  `error` object. This is the non-payments sibling of a decline-code catalog: it says why the
  payer call did not produce an answer.
envelope:
  location: RequestResponse.error (null on PROCESSING, SUCCESS and PARTIAL)
  fields:
  - {name: errorCategory, type: enum, description: Two-bucket category — NOT_FOUND or SYSTEM_ERROR.}
  - {name: errorCode, type: enum, description: Machine-readable failure code within the category. Dispatch on this.}
  - {name: errorMessage, type: string, description: Human-readable sentence. Wording may change between releases — do not match on it.}
categories:
- id: NOT_FOUND
  meaning: The payer could not find what you asked about.
- id: SYSTEM_ERROR
  meaning: Any other failure — IVR navigation, payer refusal, unreachable, etc.
stability: >-
  Existing codes will not be renamed. New codes may be introduced — new *_MISSING or *_INCORRECT
  codes appear when new schemas reference new fields. When bucketing for analytics, default unknown
  values to OTHER rather than dropping the row.
system_error_codes:
- code: IVR_FAILURE
  meaning: Could not navigate the payer's phone system to reach a representative (no rep-routing option, dead-end menus).
- code: PAYER_REFUSAL
  meaning: Representative refused to provide the information — declined to interact with an automated agent, declined to speak with a third party, or refused the specific query.
- code: UNABLE_TO_REACH_HUMAN_IN_TIME
  meaning: Could not connect to a representative within the per-request retry budget — voicemail-only line, hold time exceeded, repeated long waits.
- code: REQUIRES_OTHER_CHANNEL
  meaning: Payer requires the request through portal, fax, email, or another channel SuperDial does not currently support.
- code: MATCHED_PHONE_NUMBER_INCORRECT
  meaning: SuperDial dialed a number from a payer-directory match or agent lookup and that number was incorrect. Attributed to SuperDial, not to your input.
- code: OTHER
  meaning: A SYSTEM_ERROR that did not fit a more specific code. Inspect errorMessage.
not_found_entity_codes:
- {code: MEMBER_NOT_FOUND, meaning: Member could not be located from the supplied identifiers.}
- {code: PROVIDER_NOT_FOUND, meaning: Provider could not be located.}
