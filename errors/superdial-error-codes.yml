notes:
- >-
  This registry is unusually complete for a voice-AI provider: it distinguishes "the payer could
  not find it" from "our automation failed", and it attributes a bad phone number to whichever
  party supplied it. Both distinctions are directly actionable by an agent deciding whether to
  retry, re-input, or escalate.
- >-
  HTTP-transport errors are captured separately in errors/superdial-problem-types.yml.
