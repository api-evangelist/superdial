dialing_number_attribution:
  description: >-
    When a call fails because the dialed number was wrong, the code and category depend on where
    that number came from, so responsibility is explicit in the data.
  rules:
  - {number_source: SuperDial payer-directory match or SuperDial-agent lookup, errorCategory: SYSTEM_ERROR, errorCode: MATCHED_PHONE_NUMBER_INCORRECT}
  - {number_source: A number a representative referred us to on an earlier call, errorCategory: NOT_FOUND, errorCode: REPRESENTATIVE_PHONE_NUMBER_INCORRECT}
  - {number_source: The number you supplied in inputs.phoneNumber or a configured override, errorCategory: NOT_FOUND, errorCode: INPUT_PHONE_NUMBER_INCORRECT}
  legacy_note: >-
    Older calls placed before this attribution shipped, or calls where the number's source was not
    recorded, may still surface the generic PHONE_NUMBER_INCORRECT code — under SYSTEM_ERROR when
    SuperDial looked up the number, otherwise NOT_FOUND. Handle both the generic and the
    provenance-specific codes.
