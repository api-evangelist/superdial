deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation headers, and no operation is marked
    deprecated in the OpenAPI. The only forward-compatibility commitment published anywhere is a
    narrow one about the error taxonomy.
  partial_commitment:
    scope: errorCode registry only
    statement: >-
      "Existing codes won't be renamed. New codes may be introduced... When bucketing for
      analytics, default unknown values to OTHER rather than dropping the row."
    source: https://docs.superdial.com/guides/concepts#errorcode
    assessment: >-
      A real, useful stability guarantee — but it covers the error enum only, not endpoints,
      request shapes or response fields.
  schema_retirement:
    mechanism: account-scoped
    description: >-
      Individual schemas CAN be retired: GET /v1/schemas filters out schemas no longer accessible
      for the account, and a retired schemaId returns 404 SCHEMA_NOT_FOUND. This is per-account
      lifecycle managed by SuperDial, not a published API deprecation process, and there is no
      documented notice period.
