description: >-
  Entity graph derived from the SuperDial OpenAPI component schemas and $ref links, enriched from
  the published concepts glossary.
entities:
- name: Request
  schema: RequestResponse
  description: >-
    A single structured data extraction job against one payer. The central entity — everything else
    hangs off it.
  identifier: {field: requestId, format: 20-character opaque string}
  key_fields: [requestId, requestBatchId, schemaId, requestType, state, inputs, results, missingFields, dateCreated, completedAt, dueDate, internalId, internalTag, modality, data_completeness, error, payerLookup, to]
  states: [PROCESSING, SUCCESS, PARTIAL, FAILURE]
  enrichment_fields: [transcript, transcriptPostCall, recordingDownloadUrl, callDuration, callFromNumber, callSummary, callAuditSummary, contributingCalls, callSteps, resultSources]
- name: RequestBatch
  description: >-
    A scheduling grouping, NOT a submission grouping. Requests scheduled for the same business day
    share a requestBatchId; one POST can produce several.
  identifier: {field: requestBatchId, format: 20-character opaque string}
- name: Schema
  schema: SchemaSummary
  description: >-
    Defines both the inputs a request requires and the fields returned in results. Provisioned per
    account; can be retired.
  identifier: {field: schemaId}
  key_fields: [schemaId, requestType]
- name: RequestType
  description: >-
    Server-derived category of extraction, carried on the schema (e.g. claim-status, vob). Sending
    requestType on a POST is silently ignored.
  identifier: {field: requestType, format: slug}
- name: Payer
  schema: MatchedPayerEntry
  description: The insurance company a request asks about, identified by inputs.payerName.
  identifier: {field: payerName, format: free-text name resolved by lookup}
- name: PayerLookup
  schema: PayerLookup
  description: Resolution record reporting the payer match and the number that will be dialed.
  key_fields: [inputPayerName, inputPhoneNumber, matchedPayerName, matchedPayerPhone, phoneNumberToUse, phoneNumberSource]
- name: CallStep
  description: >-
    One effort within a request. A follow-up step (e.g. prior auth after benefits) appears as a
    second entry linked back by triggeredBy.
  key_fields: [schemaId, triggeredBy, numContributingCalls]
- name: ContributingCall
  description: An individual phone call behind a step, with its own transcript and captured fields.
  identifier: {field: id, format: opaque}
- name: ResultSources
  description: Map from each result field to the call that produced it, and through that call's step to the schema behind it.
- name: Error
  description: Structured business-outcome failure on a FAILURE request.
  key_fields: [errorCategory, errorCode, errorMessage]
- name: Webhook
  description: Outbound notification sent when a request reaches a terminal state.
  key_fields: [requestId, requestBatchId, state, internalId, internalTag]
