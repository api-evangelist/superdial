notes:
- >-
  The `results` object is deliberately untyped in the contract — its keys are defined by the
  account's schema at runtime, not by the OpenAPI. This means the response shape of the primary
  business payload cannot be known from the specification alone; it must be discovered at runtime
  via GET /v1/schemas/{schemaId}/required-inputs. That is the single biggest limitation of this
  data model for an agent or a code generator.
- >-
  The call-provenance chain (Request -> CallStep -> ContributingCall -> ResultSources) is unusually
  rich: it lets a consumer trace any individual result field back to the specific phone call and
  schema that produced it. That is a genuine auditability feature for a regulated healthcare buyer.
